# ─────────────────────────────────────────────────────────────────────────────
# tmux.conf — the parts home-manager's programs.tmux options cannot express.
#
# Generated into ~/.config/tmux/tmux.conf after the standard settings, which
# are declared in modules/tmux/default.nix:
#
#   default-terminal "tmux-256color"   base-index / pane-base-index 1
#   status-keys + mode-keys vi         mouse on, focus-events on
#   escape-time 0                      history-limit 50000
#   aggressive-resize on               h/j/k/l + H/J/K/L pane bindings
#   clock-mode-style 24                prefix C-a (C-a C-a sends a literal C-a)
#
# Target: tmux >= 3.8 inside kitty (TERM=xterm-kitty).
# Reload: C-a r, or `tmux source-file ~/.config/tmux/tmux.conf`
# ─────────────────────────────────────────────────────────────────────────────

# ─── kitty integration ──────────────────────────────────────────────────────

# tmux already detects clipboard/focus/title/cursor-colour/cursor-style for
# xterm-kitty (via the `xterm*` class). These are things kitty supports but that
# tmux cannot infer from its terminfo entry:
#   RGB          24-bit colour
#   usstyle      styled + coloured underlines (undercurl via Smulx/Setulc),
#                i.e. LSP diagnostics rendered by nvim
#   sync         DECSET 2026 synchronized updates (no tearing / flicker)
#   hyperlinks   OSC 8 clickable links (ctrl+click opens them in kitty)
#   progressbar  OSC 9;4 progress forwarded to kitty's window (nvim, cargo…)
#   osc7         cwd reporting, so kitty's launch --cwd=current works
#   overline, strikethrough   extra SGR attributes
set -as terminal-features ",xterm-kitty:RGB:usstyle:sync:hyperlinks:progressbar:osc7:overline:strikethrough"

# Deliberately NOT enabling `extended-keys` / the `extkeys` feature: kitty does
# not implement xterm's modifyOtherKeys, it only speaks the kitty keyboard
# protocol, which tmux 3.8 does not understand yet. Declaring extkeys here would
# make tmux wait for CSI 27;… sequences that never arrive (and kitty logs an
# error when tmux asks it to enable modifyOtherKeys).

# Clipboard over OSC 52: kitty accepts clipboard writes by default, so mouse
# selection, `y` in copy mode and OSC 52 from nvim/ssh all land in the system
# clipboard without wl-copy/xclip.
set -g set-clipboard on

# Let panes send APC/DCS sequences straight to kitty. Needed for the kitty
# graphics protocol (kitten icat, image/file previews) inside tmux >= 3.3.
set -g allow-passthrough on

# Requires tmux >= 3.8 (nixpkgs' locked revision has 3.7c to date).
# set -s theme terminal

# Let tmux own the window/tab title so kitty's tabs are meaningful.
set -g set-titles on
set -g set-titles-string "#S:#I #{pane_current_command}"

# ─── behaviour not covered by the Nix options ───────────────────────────────

set -g renumber-windows on
set -g display-time 2000
set -g status-interval 5
setw -g monitor-activity on
set -g visual-activity off
setw -g automatic-rename-format "#{pane_current_command}"

# ─── look & feel (uses the terminal palette, so kitty's theme wins) ──────────

set -g status-position bottom
set -g status-justify left
set -g status-style "fg=default,bg=default"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[fg=green,bold] #S #[default]"
set -g status-right "#{?client_prefix,#[fg=black,bg=yellow,bold] PREFIX #[default] ,}#[fg=green]#{pane_current_command}#[fg=colour8] │ %H:%M "

setw -g window-status-separator ""
setw -g window-status-style "fg=colour8,bg=default"
setw -g window-status-current-style "fg=black,bg=green,bold"
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "

set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=green"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=green,bold],#[fg=colour8]} #{pane_index} #{pane_title}#[default] "

setw -g pane-scrollbars modal
setw -g pane-scrollbars-style "fg=green,bg=default,width=1,pad=0"

setw -g mode-style "fg=black,bg=yellow"
setw -g copy-mode-match-style "fg=black,bg=blue"
setw -g copy-mode-current-match-style "fg=black,bg=yellow"
set -g popup-border-lines rounded

# ─── keys ───────────────────────────────────────────────────────────────────

# Splits stay in the current directory and use the intuitive characters.
unbind '"'
unbind %
bind -N "Split the pane into two, left and right" | split-window -h -c "#{pane_current_path}"
bind -N "Split the pane into two, top and bottom" - split-window -v -c "#{pane_current_path}"
bind -N "Create a new window in the current directory" c new-window -c "#{pane_current_path}"

# Window navigation / reordering (pane hjkl + HJKL resizing come from the
# customPaneNavigationAndResize option).
bind -r -N "Select the previous window" C-h previous-window
bind -r -N "Select the next window" C-l next-window
bind -r -N "Swap this window with the previous one" '<' swap-window -t -1
bind -r -N "Swap this window with the next one" '>' swap-window -t +1

# Floating pane (tmux 3.7+, improved in 3.8).
bind -N "Create a floating pane in the current directory" m new-pane -c "#{pane_current_path}"

# Reload this file.
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Copy mode: v/V/C-v, `y`, and mouse drag already copy to the system clipboard
# through set-clipboard; nothing to rebind. `prefix + ]` pastes.
